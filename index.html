<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Cédula 🇪🇨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Validador de Cédula Ecuatoriana</h1>
        <p>Ingrese los 10 dígitos de la cédula:</p>
        <input type="text" id="cedulaInput" maxlength="10" placeholder="Ej: 0912345678">
        <button class="boton" onclick="validarCedula()">Verificar</button>
        <p class="resultado" id="resultado"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
